<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trust Builder - 深度互动画像</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <div id="home-screen" class="screen active">
            <div class="hero">
                <div class="logo">🤝</div>
                <h1>AI Trust Builder</h1>
                <p class="subtitle">让 AI 真正懂你</p>
                <p class="description">
                    基于认知科学和人格心理学的深度测评<br>
                    生成个性化的 AI 互动指南，不只是标签
                </p>
            </div>
            <div class="start-section">
                <input type="text" id="user-id" placeholder="输入你的名字或ID" class="input-field">
                <button id="start-btn" class="btn-primary" disabled>加载中...</button>
                <p class="duration-hint">约 5-8 分钟 · 16 道精选问题</p>
            </div>
        </div>

        <!-- 问卷页面 -->
        <div id="quiz-screen" class="screen">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text">
                <span id="current-level">维度名称</span>
                <span id="question-counter">1/16</span>
            </div>

            <div class="question-card">
                <div class="level-badge" id="level-badge">维度</div>
                <p class="dimension-desc" id="dimension-desc">维度描述</p>
                <h2 id="question-text" class="question-text">问题内容</h2>
                <div id="options-container" class="options-container"></div>
            </div>

            <div class="nav-buttons">
                <button id="prev-btn" class="btn-secondary" disabled>上一题</button>
            </div>
        </div>

        <!-- 结果页面 -->
        <div id="result-screen" class="screen">
            <div class="result-header">
                <div class="success-icon">✨</div>
                <h1>你的深度画像已完成</h1>
                <p>基于 16 个维度的分析结果</p>
            </div>

            <!-- 人格原型卡片 -->
            <div class="archetype-card">
                <div class="archetype-icon">🎭</div>
                <h2 id="archetype-name">人格类型</h2>
                <p id="archetype-desc">人格描述</p>
            </div>

            <!-- 统计信息 -->
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-number">16</span>
                    <span class="stat-label">测评维度</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">5</span>
                    <span class="stat-label">核心领域</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="trait-count">0</span>
                    <span class="stat-label">特质标签</span>
                </div>
            </div>

            <!-- 详细报告 -->
            <div id="report-content" class="report-content"></div>

            <!-- 行动按钮 -->
            <div class="action-buttons">
                <button id="download-btn" class="btn-primary">
                    <span class="icon">📥</span> 下载完整 USER.md
                </button>
                <button id="restart-btn" class="btn-secondary">重新测评</button>
            </div>

            <div class="tips-section">
                <h4>💡 如何使用</h4>
                <p>将下载的 USER.md 文件提供给 AI 助手，或直接将报告内容粘贴到对话开头。AI 会根据你的画像调整互动方式。</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
